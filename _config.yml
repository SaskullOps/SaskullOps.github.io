# The Site Configuration
# ================================================

# Import the theme
theme: jekyll-theme-chirpy

# The language of the webpage
lang: es                    

# Change to your timezone
timezone: Europe/Madrid     

# jekyll-seo-tag settings
# ↓ --------------------------

title: "Cybersecurity & Automation Engineer"
    
tagline: "Power Platform • Security • Cloud • Automation"

description: >-
  Blog personal de Alex Guardiola: write-ups de ciberseguridad,
  apuntes técnicos y reflexiones sobre la transición desde el
  ecosistema Microsoft (Power Platform, M365) hacia el mundo
  infosec. CTFs, lab notes y aprendizaje en abierto.

# Fill in the protocol & hostname for your site.
url: "https://saskullops.github.io"    

github:
  username: SaskullOps

twitter:
  username: # Déjalo vacío si no tienes Twitter

social:
  name: Alex Guardiola
  email: a.guardiola.m@gmail.com
  fediverse_handle:         # Déjalo vacío
  links:
    - https://github.com/SaskullOps
    - https://www.linkedin.com/in/%C3%A0lex-guardiola-mart%C3%ADnez-67a5a8133/

# ↑ --------------------------
# The end of `jekyll-seo-tag` settings

# Site Verification Settings (RECOMENDADO)
webmaster_verifications:
  google:                   # ✅ AGREGAR TU CÓDIGO DE GOOGLE (explicado después)
  bing:
  alexa:
  yandex:
  baidu:
  facebook:

# Web Analytics Settings
analytics:
  google:
    id:                     # ✅ AGREGAR TU GOOGLE ANALYTICS ID (explicado después)
  goatcounter:
    id:
  umami:
    id:
    domain:
  matomo:
    id:
    domain:
  cloudflare:
    id:
  fathom:
    id:

# Page views settings
pageviews:
  provider:                 # 

# Prefer color scheme setting
theme_mode:                 # permite toggle automático dark/light

# The CDN endpoint for media resources
cdn:                        # Dejar vacío

# the avatar on sidebar
avatar: /assets/img/brand/saskullops-avatar-ring-512.png

# The URL of the site-wide social preview image
social_preview_image: /assets/img/brand/saskullops-banner.png

# boolean type, the global switch for TOC in posts
toc: true                   # Tabla de contenidos habilitada

# ✅ COMENTARIOS HABILITADOS (NUEVO)
comments:
  provider: utterances      # Comentarios con Utterances
  utterances:
    repo: SaskullOps/saskullops.github.io
    issue_term: pathname    # Usar la URL del post como identificador
    label: comments
    theme: preferred-color-scheme  # Automático (light/dark)

# Self-hosted static assets (DEJAR COMO ESTÁ)
assets:
  self_host:
    enabled:
    env:

# PWA Settings
pwa:
  enabled: true             #  PWA habilitado
  cache:
    enabled: true
    deny_paths: []

# Pagination
paginate: 10                # CORRECTO

# The base URL of your site
baseurl: ""                 # vacío porque es root del repo

# ------------ The following options are NOT recommended to be modified ------------------

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
